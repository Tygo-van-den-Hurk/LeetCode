name: Deploy to GitHub Pages
# Updates the GitHub pages website with the changes made in the last push.
# Takes in all markdown files and images of the repository and turns that
# into HTML to present on the GitHub pages website. Used for documentation.

on:
  workflow_dispatch:
  push:
    branches: [main, master, release, development]
    paths: [".github/workflows/pages.yml", "src/**/*.rs"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build site with cargo doc
        run: cargo doc
      - name: Add index redirect
        run: echo $redirect > target/doc/index.html
        env:
          redirect: <meta http-equiv="refresh" content="0; url=leetcode/">
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: ./target/doc/ }

  deploy:
    name: Deploy site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
